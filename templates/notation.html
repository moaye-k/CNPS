{% extends "base.html" %}
{% block hero_title %}{{ section }}{% endblock %}
{% block content %}
<form method="POST" action="{{ next_url }}">
    {% for code, texte in questions %}
    <div class="question-block">
        <label class="field-label">{{ texte }}</label>
        <div class="scale-row">
            {% for valeur, libelle in echelle %}
            <div class="scale-option">
                <input type="radio" name="{{ code }}" id="{{ code }}_{{ valeur }}" value="{{ valeur }}" required>
                <label for="{{ code }}_{{ valeur }}"><span class="rating-star" aria-hidden="true">★</span><span class="rating-label">{{ libelle }}</span></label>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
    <div class="form-actions">
        <a class="btn btn-secondary" href="{{ previous_url }}">Précédent</a>
        <button class="btn" type="submit">Continuer</button>
    </div>
</form>
{% endblock %}
